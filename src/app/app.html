<div class="card">
  <h1>{{ name }}</h1>
  <p class="role">{{ role }}</p>

  <h2>Skills</h2>
  <ul>
    @for (skill of skills; track skill) {
      <li>{{ skill }}</li>
    }
  </ul>

  <button (click)="showMessage()">Show message</button>

  @if (message()) {
    <p class="message">{{ message() }}</p>
  }
</div>
